[project]
name = "formal-rl"
version = "0.0.0"
description = "Research workspace for efficient reinforcement learning with Lean verification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["ijson>=3.4,<4"]

[dependency-groups]
dev = ["pre-commit>=4,<5"]
local-probe = [
    "math-verify[antlr4-13-2]>=0.9.0",
    "mlx-lm==0.32.0",
    "pyarrow>=25.0.1",
]
